name: Daily Stock Ticker Update

on:
  schedule:
    # Use off-minute times to reduce delays during GitHub Actions peak load.
    - cron: "17 10 * * 1-5"
    # A second run provides a same-day fallback if the first schedule is dropped.
    - cron: "47 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-stock-ticker-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements/development.txt
          pip install --no-deps -e .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check current snapshot date
        id: freshness
        run: echo "current=$(python -m top_us_stock_tickers.freshness data/v2/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Run update script
        if: github.event.schedule != '47 12 * * 1-5' || steps.freshness.outputs.current != 'true'
        run: python -m top_us_stock_tickers.updater

      - name: Commit and push changes
        if: github.event.schedule != '47 12 * * 1-5' || steps.freshness.outputs.current != 'true'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Add the complete published snapshot and its metadata
          git add -A -- tickers/ by_industry/ data/v2/ manifest.json
          
          # Check for changes before committing to avoid empty commit errors
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update ticker lists: $(date -u)"
            git push
          fi
