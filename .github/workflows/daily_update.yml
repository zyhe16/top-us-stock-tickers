name: Daily Stock Ticker Update

on:
  schedule:
    # Run weekdays at 10:00 UTC (Mon-Fri, before US Market Open)
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run update script
        run: python update_tickers.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Add the complete published snapshot and its metadata
          git add -A -- tickers/ by_industry/ data/v2/ manifest.json
          
          # Check for changes before committing to avoid empty commit errors
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update ticker lists: $(date -u)"
            git push
          fi
