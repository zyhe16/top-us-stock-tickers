[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "top-us-stock-tickers"
version = "2.0.0"
description = "Validated US ticker datasets and a read-only query API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
top_us_stock_tickers = ["static/*.html", "static/fonts/*"]
